[package]
name = "lib-comrak"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
comrak = { version = "0.56", default-features = false }
dunce = "1"
mime_guess = "2"
notify = "8.2"
quick-xml = { version = "0.42", features = ["escape-html"] }
regex = "1"
serde_json = "1"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
