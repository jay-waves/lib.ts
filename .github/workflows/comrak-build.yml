name: lib.comrak Windows build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/lib-comrak/**', 'src/markdown/headings.rs', 'web/markdown/*.css', 'web/raw/raw-highlight.mjs', 'scripts/*comrak*.mjs', 'Cargo.toml', 'Cargo.lock', 'package*.json', '.github/workflows/comrak-build.yml']
  pull_request:
    branches: [main]
    paths: ['crates/lib-comrak/**', 'src/markdown/headings.rs', 'web/markdown/*.css', 'web/raw/raw-highlight.mjs', 'scripts/*comrak*.mjs', 'Cargo.toml', 'Cargo.lock', 'package*.json', '.github/workflows/comrak-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:comrak-assets
      - run: cargo fmt -p lib-comrak --check
      - run: cargo test --release --locked -p lib-comrak
      - run: cargo clippy --release --locked -p lib-comrak --all-targets -- -D warnings
      - run: npm run package:comrak
      - uses: actions/upload-artifact@v7
        with:
          name: lib.comrak-windows-x64
          path: release/lib.comrak-win32-x64/
          if-no-files-found: error
          retention-days: 90
