# Main builds the reusable Windows artifact; tags publish the matching commit
# into a stable rolling release or a versioned prerelease instead of rebuilding it.
name: Windows native build

on:
  push:
    branches: [main]
    tags: ['*', '!*-latest']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-windows:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Only restore the executable when all Rust build inputs match exactly.
      # Keep embedded assets here in sync with include_str!/include_bytes! in src/.
      # Bump v1 or the toolchain prefix when compiler flags or the build command change.
      # Publishing/frontend workflow edits must not invalidate this cache.
      - name: Restore Windows executable
        id: executable-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/windows-executable
          key: windows-executable-v1-rust-1.99.0-${{ hashFiles('src/**', 'Cargo.toml', 'Cargo.lock', 'build.rs', '.cargo/**', 'rust-toolchain*', 'web/media/image-theme.css', 'fonts/manifest.json') }}

      - name: Report executable cache match
        shell: pwsh
        env:
          EXECUTABLE_CACHE_KEY: ${{ steps.executable-cache.outputs.cache-primary-key }}
          EXECUTABLE_CACHE_HIT: ${{ steps.executable-cache.outputs.cache-hit }}
        run: |
          Write-Output "Executable cache key: $env:EXECUTABLE_CACHE_KEY"
          Write-Output "Exact executable cache match: $env:EXECUTABLE_CACHE_HIT"
          if ($env:EXECUTABLE_CACHE_HIT -ne 'true') {
            Write-Output 'Executable cache unavailable for these Rust inputs; restoring Cargo dependencies and building once.'
          }

      - name: Install Rust
        if: steps.executable-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt

      - name: Cache Cargo dependencies and build artifacts
        if: steps.executable-cache.outputs.cache-hit != 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Report Rust cache match
        if: steps.executable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_REF: ${{ github.ref }}
        run: |
          Write-Output "Cache scope: $env:CACHE_REF"
          Write-Output "Exact Rust cache match: $env:RUST_CACHE_HIT (partial matches may also restore dependencies)"

      - name: Check Rust formatting
        if: steps.executable-cache.outputs.cache-hit != 'true'
        run: cargo fmt --check

      - name: Check Windows Rust targets
        if: github.event_name == 'pull_request' && steps.executable-cache.outputs.cache-hit != 'true'
        run: cargo check --release --locked --all-targets

      - name: Build Windows release
        if: github.event_name != 'pull_request' && steps.executable-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --timings

      # Stage outside target/ so rust-cache post-job cleanup cannot remove it.
      - name: Stage Windows executable for reuse
        if: github.event_name != 'pull_request' && steps.executable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'windows-executable'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/lib-ts.exe' $stage

      # Save immediately after staging, independently of later artifact uploads.
      - name: Save Windows executable
        if: github.ref == 'refs/heads/main' && steps.executable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/windows-executable
          key: ${{ steps.executable-cache.outputs.cache-primary-key }}

      - name: Upload Rust build timings
        if: always() && github.event_name != 'pull_request' && steps.executable-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rust-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows executable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: ${{ runner.temp }}/windows-executable/lib-ts.exe
          if-no-files-found: error
          retention-days: 1

  assemble-windows:
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    needs: [build-frontend, build-windows]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: windows-executable
          path: target/release

      - name: Assemble artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'lib.ts'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/lib-ts.exe' (Join-Path $stage 'lib.ts.exe')
          Copy-Item 'dist' $stage -Recurse
          Copy-Item 'fonts' $stage -Recurse
          Copy-Item 'LICENSE' $stage

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: lib.ts
          path: ${{ runner.temp }}/lib.ts
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref, '-latest')
    concurrency:
      group: rolling-release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve release series
        id: series
        uses: actions/github-script@v9
        with:
          script: |
            const version = context.ref.replace('refs/tags/', '');
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(alpha|beta)(?:\.(0|[1-9]\d*))?)?$/.exec(version);
            if (!match) throw new Error(`Expected a version tag such as 0.3.2, 0.3.2-alpha or 0.3.2-beta.1, got ${version}`);
            const prerelease = Boolean(match[4]);
            const tag = prerelease ? version : `${match[1]}.${match[2]}-latest`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // Resolve annotated tags to the commit, rather than using the tag object SHA.
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: version });
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
              const current = /Actual version: \[([0-9]+\.[0-9]+\.[0-9]+)\]/.exec(release.body || '');
              if (current && BigInt(current[1].split('.')[2]) > BigInt(match[3])) {
                throw new Error(`Refusing to replace ${current[1]} with older version ${version}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('prerelease', String(prerelease));
            core.setOutput('description', prerelease ? 'This is a prerelease for testing.' : 'This release tracks the latest stable version in this series. Its download is replaced on each release.');
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('sha', commit.sha);
            core.setOutput('asset', `lib.ts-${tag}-windows-x86_64.tar.xz`);

      - name: Find successful main build for this commit
        id: main-build
        uses: actions/github-script@v9
        with:
          script: |
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let attempt = 1; attempt <= 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'windows-build.yml',
                branch: 'main',
                event: 'push',
                head_sha: '${{ steps.series.outputs.sha }}',
                per_page: 100,
              });
              if (data.workflow_runs.length === 0) {
                core.setFailed(`No main build exists for ${{ steps.series.outputs.sha }}. Run the main build before publishing this tag.`);
                return;
              }
              const successful = data.workflow_runs
                .filter(run => run.status === 'completed' && run.conclusion === 'success')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (successful) {
                core.setOutput('run_id', String(successful.id));
                core.info(`Using successful main build ${successful.html_url}`);
                return;
              }
              const active = data.workflow_runs.some(run => run.status !== 'completed');
              const completed = data.workflow_runs.some(run => run.status === 'completed');
              if (completed && !active) {
                core.setFailed(`The main build for ${context.sha} completed without success. Rerun the main build before publishing this tag.`);
                return;
              }
              core.info(`Waiting for the main build of ${context.sha} (attempt ${attempt}/60).`);
              await sleep(30_000);
            }
            core.setFailed(`Timed out waiting for a successful main build for ${context.sha}.`);

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: lib.ts
          path: ${{ runner.temp }}/lib.ts
          run-id: ${{ steps.main-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify downloaded build
        run: test -f "$RUNNER_TEMP/lib.ts/lib.ts.exe"

      - name: Package Windows release
        env:
          RELEASE_ASSET: ${{ steps.series.outputs.asset }}
          XZ_OPT: "-9 -T2"
        run: tar -cJf "$RUNNER_TEMP/$RELEASE_ASSET" lib.ts
        working-directory: ${{ runner.temp }}

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.series.outputs.tag }}
          target_commitish: ${{ steps.series.outputs.sha }}
          name: lib.ts ${{ steps.series.outputs.tag }}
          prerelease: ${{ steps.series.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.series.outputs.prerelease == 'true' && 'false' || 'true' }}
          body: |
            Actual version: [${{ steps.series.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.series.outputs.version }})

            ${{ steps.series.outputs.description }}
          files: ${{ runner.temp }}/${{ steps.series.outputs.asset }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Point rolling tag at the published version
        if: steps.series.outputs.prerelease == 'false'
        uses: actions/github-script@v9
        env:
          ROLLING_TAG: ${{ steps.series.outputs.tag }}
          RELEASE_SHA: ${{ steps.series.outputs.sha }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const ref = `tags/${process.env.ROLLING_TAG}`;
            const sha = process.env.RELEASE_SHA;
            try {
              await github.rest.git.getRef({ ...repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: `refs/${ref}`, sha });
              return;
            }
            await github.rest.git.updateRef({ ...repo, ref, sha, force: true });
