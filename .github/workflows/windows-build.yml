name: Windows native build

on:
  push:
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-windows:
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Build Windows release
        run: cargo build --release --locked

      - name: Assemble artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'lib.ts'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/saved-notes-library.exe' (Join-Path $stage 'lib.ts.exe')
          Copy-Item 'dist' $stage -Recurse
          Copy-Item 'fonts' $stage -Recurse
          Copy-Item 'LICENSE' $stage

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lib.ts
          path: ${{ runner.temp }}/lib.ts
          if-no-files-found: error
          compression-level: 9

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: lib.ts
          path: ${{ runner.temp }}/lib.ts

      - name: Package Windows release
        run: zip -r "$RUNNER_TEMP/lib.ts-${GITHUB_REF_NAME}-windows-x86_64.zip" lib.ts
        working-directory: ${{ runner.temp }}

      - name: Publish tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: lib.ts ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/lib.ts-${{ github.ref_name }}-windows-x86_64.zip
          fail_on_unmatched_files: true
